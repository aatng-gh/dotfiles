# General
# Empty editor values use $EDITOR.
editor = ""
dir_editor = "nvim"
auto_check_update = false
# Change the shell directory to Superfile's last location on exit.
cd_on_quit = false

# Preview and paths
default_open_file_preview = false
show_image_preview = true
show_panel_footer_info = true
default_directory = "."

# Sorting
# SI uses powers of 1000; false uses powers of 1024.
file_size_use_si = false
# Sort: 0 name, 1 size, 2 modified, 3 type, 4 natural.
default_sort_type = 4
sort_order_reversed = false
case_sensitive_sort = false

# Behavior
shell_close_on_success = false
# 0 scrolls one full page.
page_scroll_size = 0
debug = false
# Keep false to warn when new config fields are missing.
ignore_missing_fields = false

# File panel
file_panel_extra_columns = 0
file_panel_name_percent = 50

# Appearance
theme = "nvim-dark"
# Empty uses Chroma; "bat" uses bat.
code_previewer = ""
# Icons require a Nerd Font.
nerdfont = true
show_select_icons = true
transparent_background = false

# Layout
# Preview width is 1/n of the screen; 0 follows the picker width.
file_preview_width = 0
enable_file_preview_border = false
# Set to 0 to hide the sidebar.
sidebar_width = 20
sidebar_sections = ["home", "pinned", "disks"]

# Borders
# Each glyph must occupy one terminal cell.
border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '┌'
border_top_right = '┐'
border_bottom_left = '└'
border_bottom_right = '┘'
border_middle_left = '├'
border_middle_right = '┤'

# Integrations
# These require exiftool, md5sum, and zoxide respectively.
metadata = false
enable_md5_checksum = false
zoxide_support = true

# File openers
# Map file extensions to commands; Superfile appends the file path.
[open_with]
