# Use Ctrl-Space as the prefix. Press Ctrl-Space twice to send it to an app.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload this file with Ctrl-Space r.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Practical defaults.
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys vi

# Good color support for modern terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"

# Simple status bar using the Neovim default dark palette.
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#14161b,fg=#e0e2ea"
set -g status-left-length 24
set -g status-right-length 80
set -g status-left "#{?client_prefix,#[bg=#fce094],#[bg=#a6dbff]}#[fg=#14161b,bold] #S #[bg=#14161b,fg=#4f5258,nobold] "
set -g status-right "#[fg=#9b9ea4]#{b:pane_current_path}  #[fg=#4f5258]·  #[fg=#e0e2ea]%H:%M "
set -g window-status-separator ""
set -g window-status-format "#[fg=#9b9ea4] #I #W "
set -g window-status-current-format "#[bg=#2c2e33,fg=#e0e2ea,bold] #I #W "

# Pass through Shift+Enter and other modified keys (e.g. for Claude Code).
set -g allow-passthrough on
set -s extended-keys on

# Open new windows and panes in the current pane's directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate and resize panes with Vim-style keys.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Select and copy in vi copy mode.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
